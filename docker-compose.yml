version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartreco-postgres
    environment:
      POSTGRES_USER: smartreco
      POSTGRES_PASSWORD: smartreco_password
      POSTGRES_DB: smartreco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartreco"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartreco-network

  redis:
    image: redis:7-alpine
    container_name: smartreco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartreco-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: smartreco-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartreco-network

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartreco-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartreco:smartreco_password@postgres:5432/smartreco_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/chroma:/app/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - smartreco-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartreco-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - app
    networks:
      - smartreco-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local

networks:
  smartreco-network:
    driver: bridge

