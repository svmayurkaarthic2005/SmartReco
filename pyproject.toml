[project]
name = "smartreco"
version = "1.0.0"
description = "SmartReco Behavioral AI Recommendation Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "apscheduler>=3.10.4",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.1",
    "langgraph>=0.0.20",
    "langchain>=0.1.4",
    "langchain-core>=0.1.16",
    "langchain-community>=0.0.16",
    "langsmith>=0.0.83",
    "openai>=1.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "aiosmtplib>=3.0.1",
    "email-validator>=2.1.0.post1",
    "jinja2>=3.1.3",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3.post1",
    "structlog>=24.1.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
